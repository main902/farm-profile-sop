<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
.w{width:1000px;padding:4px 0 6px}
details{border:2px solid #f3c7a8;border-radius:12px;background:#fffaf6}
summary{cursor:pointer;font-weight:900;font-size:17px;padding:8px 14px;color:#c8361c}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 12px 12px}
.g div{background:#fff;border:1px solid #e9cbb6;border-radius:10px;padding:8px 10px;font-size:15px;font-weight:700;line-height:1.5}
.g b{display:block;color:#c8361c}
.g code{font-family:inherit;font-weight:400;color:#3a4540;word-break:break-all}
</style></head><body><div class="w"><details><summary>Google Map情報の例（どれか1つでOK）</summary><div class="g">
<div><b>🔗 共有リンク</b>「共有」で表示されるリンクのコピー<br><code>例：https://maps.app.goo.gl/YRZjwykURuxgmoTQA</code></div>
<div><b>＋ Plus Code</b>Plus Codeのコピー<br><code>例：C872+8V 泉佐野市、大阪府</code></div>
<div><b>🧭 緯度・経度</b>緯度・経度の情報<br><code>例：34°24'47.7"N 135°18'09.5"E または 34.413250, 135.302639</code></div>
</div></details></div></body></html>
