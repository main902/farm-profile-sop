<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.st{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;border:2px solid var(--k);background:var(--k-bg);border-radius:14px;padding:9px 16px}
.st .n{width:44px;height:44px;border-radius:50%;background:var(--k);color:#fff;font-size:22px;font-weight:900;text-align:center;line-height:44px}
.st b{font-size:23px;display:block;line-height:1.3}.st small{font-size:17px;color:var(--muted)}
.st.end{border-color:var(--warn);background:var(--warn-bg)}.st.end .n{background:var(--warn)}
.st.res{border-color:var(--ink);background:#f3f4f3}.st.res .n{background:var(--ink)}
.dn{text-align:center;color:var(--k);font-size:22px;line-height:1;margin:5px 0}
.side{margin:6px 0 0 64px;border:2px dashed var(--zone);border-radius:12px;padding:6px 12px;font-size:18px;background:#fffdf5;color:#5c4900;font-weight:700}
.w{--k:#c8361c;--k-bg:#fdf1ed}
.st.res{border-color:var(--ink)}
</style></head><body><div class="w">
<h1>横断パッケージの流れ</h1>
<div class="sub">決めた1日で、まとめて実施</div>
<div class="side" style="margin:0 0 10px">いつでもOK：農場聞き取りシート</div>
<div class="st"><div class="n">1</div><div><b>申請フォームで申請</b><small>方式は「横断パッケージ」を選び、農場のGoogle Map情報を送る</small></div></div><div class="dn">▼</div>
<div class="st"><div class="n">2</div><div><b>配置図を修正して、実施日をメールで連絡</b><small>共有フォルダのアドレスがメールで届く。実施日は1週間以上先に</small></div></div><div class="dn">▼</div>
<div class="st"><div class="n">3</div><div><b>採材シートを作り、キットが届く</b><small>キットは実施3日前までに届きます</small></div></div><div class="dn">▼</div>
<div class="st"><div class="n">4</div><div><b>当日：採材・撮影</b><small>先にYouTubeの実践ガイド動画（10分）を見ておく</small></div></div><div class="dn">▼</div>
<div class="st"><div class="n">5</div><div><b>冷凍便で発送して、アップロード</b><small>動画・採材シート・聞き取りシート</small></div></div><div class="dn">▼</div>
<div class="st res"><div class="n">6</div><div><b>結果レポートが返ってくる</b><small>１か月以内に返送</small></div></div>
</div></body></html>
