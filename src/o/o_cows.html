<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
.w{width:1000px;padding:6px 0 10px}
.cond{display:flex;align-items:center;gap:10px;border:2px solid #2f6688;background:#e6eef3;border-radius:12px;padding:8px 14px;font-size:19px;font-weight:900;color:#1f4a66;margin-bottom:12px}
.ages{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ag{border:3px solid #c8361c;border-radius:14px;text-align:center;padding:10px 6px;background:#fff}
.ag .d{font-size:24px;font-weight:900;color:#c8361c}
.ag .h{font-size:34px;font-weight:900;line-height:1.2}.ag .h small{font-size:18px}
.ag .c{font-size:14px;font-weight:700;color:#5d6a64}
.tot{text-align:center;font-size:18px;font-weight:900;margin:10px 0 4px}
.tot b{color:#c8361c;font-size:24px}
ul{margin:8px 0 0;padding-left:1.2em;font-size:15px;line-height:1.6;color:#3a4540}
.where{margin-top:10px;font-size:15px;font-weight:700;color:#5d6a64}
</style></head><body><div class="w">
<div class="cond">💊 14日以内に抗菌薬を使用していない牛から採材</div>
<div class="ages">
<div class="ag"><div class="d">0〜45日齢</div><div class="h">5<small>頭</small></div></div>
<div class="ag"><div class="d">46〜90日齢</div><div class="h">5<small>頭</small></div></div>
<div class="ag"><div class="d">91〜135日齢</div><div class="h">5<small>頭</small></div></div>
</div>
<div class="tot">合計 <b>15頭</b>（5頭いなければ、その群は全頭）</div>
<ul>
<li>大型農場で、牛舎ごとに病気の傾向の違いを感じている場合は、獣医師の判断で追加</li>
<li>スモール導入などで、導入後〜45日齢が上の範囲に収まらない場合は、別に採材</li>
<li>抗菌薬で治療中の牛で原因病原体を調べたい場合（Multiplex RT-qPCR）は、追加して採材（備考に記載）</li>
</ul>
<div class="where">📁 採材シートは、共有フォルダに入っています。採材当日に使う子牛のリストです</div>
</div></body></html>
