<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
.w{width:1000px;padding:6px 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c{border:2px solid var(--c);border-radius:14px;overflow:hidden}
.c h3{margin:0;background:var(--c);color:#fff;font-size:19px;font-weight:900;padding:6px 12px}
.c .b{padding:10px 12px;font-size:15.5px;line-height:1.6}
.b ul{margin:4px 0 0;padding-left:1.2em}
.nm{display:inline-block;margin:6px 0;border:2px solid #2f6688;border-radius:8px;padding:2px 10px;font-weight:900;color:#2f6688;background:#fff}
.or{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:6px}
.or div{border:2px solid #9cc0a2;background:#eaf5eb;border-radius:10px;padding:8px;text-align:center;font-weight:900;font-size:15px}
.or i{font-style:normal;font-weight:900;color:#5d6a64}
.or a{color:#2f7d3a}
.nt{font-size:14px;color:#5d6a64;margin-top:8px}
</style></head><body><div class="w"><div class="two">
<div class="c" style="--c:#2f6688"><h3>❄ サンプルを冷凍便で発送</h3><div class="b"><ul><li>冷凍した鼻咽頭スワブ（と糞便）を保冷袋に入れる</li><li>保冷袋に<b>採材日と農場名</b>を書く</li><li>返送用着払伝票を貼り、<b>冷凍便</b>でセンターへ</li></ul>品名は<br><span class="nm">チューブ（生理食塩水入り）</span></div></div>
<div class="c" style="--c:#2f7d3a"><h3>📤 データをアップロード</h3><div class="b"><ul><li>撮影した動画（採材牛、A. 従業員動線、B. 牛舎環境）</li><li>検体番号・胸囲・牛房サイズを書いた「採材シート」</li><li>記入した「農場聞き取りシート」</li></ul>
<div class="or"><div>共有フォルダの<br>「アップロード」フォルダ</div><i>または</i><div><a href="https://forms.gle/y7cM2SbSEzUasFAx7" target="_blank" rel="noopener">アップロード<br>フォーム ›</a></div></div>
<div class="nt">スマホからそのままアップロードできます。センターで確認できたら返信するので、そのあとスマホの動画は削除してOK</div></div></div>
</div></div></body></html>
