<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
:root{--o:#e0561b;--o2:#f6a04d;--ob:#fff3ea;--a:#c8361c;--k:#2f7d3a;--kb:#eaf5eb;--ab:#fdeee9;--ink:#1f2328;--mut:#5d6a64;--p:#6b3fa0}
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:"Noto Sans CJK JP",sans-serif;color:var(--ink)}
.w{width:1000px;background:#fff;padding:14px 0 18px}
.top{padding:18px 34px 0;position:relative;height:204px;background:linear-gradient(180deg,#fff 0%,#fff 70%,#fdeee3 100%)}
.cat{font-size:26px;font-weight:900;line-height:1.35}
.cat .two{color:var(--o);font-size:34px}
.ttl{font-size:48px;font-weight:900;color:var(--o);letter-spacing:.01em;margin-top:4px;line-height:1.1}
.sub{display:flex;align-items:center;gap:14px;margin-top:12px}
.sub .b{background:var(--o);color:#fff;font-size:24px;font-weight:900;padding:4px 16px;border-radius:6px}
.sub span{font-size:22px;font-weight:700}
.cows{position:absolute;right:30px;top:12px}
.sec{margin:10px 26px 0;border:2px solid #f3c7a8;border-radius:12px;overflow:hidden;background:#fff}
.sh{background:var(--o);color:#fff;font-weight:900;font-size:23px;text-align:center;padding:5px}
.four{display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px}
.four div{display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;font-weight:700;border-right:1px dashed #e6c3ab}
.four div:last-child{border:none}
.note{text-align:center;font-size:16px;font-weight:700;padding:0 0 6px}
.flow{padding:12px 16px 14px;position:relative}
.q{border:2px solid;border-radius:10px;padding:8px 14px;font-size:19px;font-weight:700;background:#fff;display:flex;align-items:center;gap:10px}
.qa{border-color:var(--o)}.qk{border-color:var(--k)}
.lab{font-size:18px;font-weight:900}
.res{border-radius:10px;color:#fff;font-weight:900;font-size:20px;text-align:center;padding:10px 6px;line-height:1.25}
.res small{display:block;font-size:14px;font-weight:700;opacity:.95}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 12px 10px}
.cd{border:2px solid;border-radius:12px;padding:10px 14px 0;display:flex;flex-direction:column}
.cd.a{border-color:#f1b9a6}.cd.k{border-color:#a9d3ae}
.cd h3{margin:0;font-size:23px;font-weight:900;text-align:center;line-height:1.2}
.cd.a h3{color:var(--a)}.cd.k h3{color:var(--k)}
.pill{display:block;width:max-content;margin:6px auto 2px;color:#fff;font-weight:900;font-size:16px;padding:1px 14px;border-radius:999px}
.cd.a .pill{background:var(--a)}.cd.k .pill{background:var(--k)}
.typ{text-align:center;font-weight:900;font-size:18px;margin-bottom:4px}
.cd.a .typ{color:var(--a)}.cd.k .typ{color:var(--k)}
.it{display:grid;grid-template-columns:30px 1fr;gap:6px;margin-top:4px}
.it h4{margin:0;font-size:17px;font-weight:900}
.cd.a h4{color:var(--a)}.cd.k h4{color:var(--k)}
.it ul{margin:1px 0 0;padding-left:1.1em;font-size:14.5px;line-height:1.36}
.ft{margin-top:auto;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(3,1fr);font-size:15px;font-weight:700;padding:7px 0;margin-left:-14px;margin-right:-14px;text-align:center}
.bot{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--o);display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:#fff}
.bot .l{font-size:26px;font-weight:900;line-height:1.3}.bot .l span{color:#ffe08a}
.bot .r{background:#fff;color:var(--o);border-radius:10px;padding:8px 18px;font-size:20px;font-weight:900;text-align:center;line-height:1.35}
.url{background:#1f3a5f;color:#fff;border-radius:6px;padding:2px 14px;font-size:18px;font-weight:900;display:inline-block;margin-bottom:4px}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px}
.cx{border:3px solid;border-radius:14px;padding:10px 14px 12px;display:flex;flex-direction:column;align-items:stretch}
.cx.a{border-color:#c8361c}.cx.k{border-color:#2f7d3a;background:#f7fbf7}
.cxh{text-align:center;font-size:27px;font-weight:900;line-height:1.2}.a .cxh{color:#c8361c}.k .cxh{color:#2f7d3a}
.cxs{text-align:center;font-size:17px;font-weight:700;color:#5d6a64;margin-bottom:6px}
.tls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tl{background:#f6f6f4;border-radius:10px;padding:8px 4px;text-align:center}
.ti{font-size:34px;line-height:1.1}.tt{font-size:16px;line-height:1.35;margin-top:4px}
.tt b{font-size:19px}
.fx{margin-top:10px;border-radius:10px;text-align:center;font-weight:900;padding:10px 6px;font-size:19px}
.fx.a{background:#fdeee9;color:#c8361c}
.fx.k{background:#2f7d3a;color:#fff;font-size:23px;line-height:1.35;box-shadow:0 0 0 3px #ffe08a inset}
