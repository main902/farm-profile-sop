<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.flow{display:grid;grid-template-columns:1fr 40px 1fr 40px 1fr;align-items:stretch;margin-top:6px}
.arw{display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted)}
.sp{border:2px solid var(--a);border-radius:14px;padding:12px 12px 12px;background:#fff;position:relative;text-align:center}
.sp .n{position:absolute;left:-10px;top:-12px;width:38px;height:38px;border-radius:50%;background:var(--a);color:#fff;font-weight:900;font-size:21px;line-height:38px}
.sp .when{display:inline-block;font-size:16px;font-weight:700;color:var(--a);background:var(--a-bg);border-radius:999px;padding:0 12px;margin-bottom:4px}
.sp svg{display:block;margin:4px auto 6px}
.sp b{display:block;font-size:23px;line-height:1.3}
.sp small{display:block;font-size:17px;color:var(--muted);line-height:1.45;margin-top:4px}
.sp small em{font-style:normal;color:var(--a);font-weight:900}
.ok{display:inline-block;margin-top:6px;font-size:17px;font-weight:900;color:#fff;background:var(--k);border-radius:999px;padding:1px 12px}
.mail{margin-top:14px;display:flex;align-items:center;gap:12px;border:2px solid var(--k);background:var(--k-bg);border-radius:12px;padding:10px 16px;font-size:20px;line-height:1.45}
.mail b{font-size:21px}
</style></head><body><div class="w">
<h1>検体の保存と発送</h1>
<div class="sub">採材から発送まで、凍ったままにするのがポイント</div>
<div class="flow">
 <div class="sp"><div class="n">1</div><span class="when">採材したら</span>
  <svg width="150" height="96" viewBox="0 0 150 96"><rect x="30" y="6" width="90" height="86" rx="8" fill="#eef4f8" stroke="#4f7a95" stroke-width="3.5"/><path d="M30 34h90" stroke="#4f7a95" stroke-width="3"/><rect x="104" y="14" width="6" height="14" rx="2" fill="#4f7a95"/><rect x="104" y="42" width="6" height="22" rx="2" fill="#4f7a95"/><path d="M54 48h10v32q0 6-5 6t-5-6z" fill="#fff" stroke="#5b9a76" stroke-width="2.5"/><rect x="53" y="44" width="12" height="6" rx="1.5" fill="#5b9a76"/><path d="M74 48h10v32q0 6-5 6t-5-6z" fill="#fff" stroke="#d39c66" stroke-width="2.5"/><rect x="73" y="44" width="12" height="6" rx="1.5" fill="#d39c66"/><path d="M59 54v22M79 54v22" stroke="#987f43" stroke-width="2"/><text x="64" y="26" text-anchor="middle" font-size="15" font-weight="900" fill="#4f7a95">❄ 冷凍庫</text></svg>
  <b>スワブごと冷凍保存</b><small>チューブの中で折ったスワブは<br>入れたまま。<em>立てたまま</em>冷凍庫へ</small><span class="ok">家庭用冷凍庫でOK</span></div>
 <div class="arw">▶</div>
 <div class="sp"><div class="n">2</div><span class="when">ある程度集まったら</span>
  <svg width="150" height="96" viewBox="0 0 150 96"><path d="M26 22h98v62q0 6-6 6H32q-6 0-6-6z" fill="#e3e7ea" stroke="#7a8a94" stroke-width="3.5"/><path d="M26 22l8-12h82l8 12" fill="#f1f3f5" stroke="#7a8a94" stroke-width="3"/><path d="M40 34l10 44M70 34l6 44M104 34l-8 44" stroke="#fff" stroke-width="3" opacity=".8"/><path d="M58 40h10v30q0 6-5 6t-5-6z" fill="#fff" stroke="#5b9a76" stroke-width="2.5"/><path d="M80 40h10v30q0 6-5 6t-5-6z" fill="#fff" stroke="#d39c66" stroke-width="2.5"/></svg>
  <b>同梱の保冷袋<br>（アルミ製）に入れる</b><small>凍ったチューブを<br>立てたまま袋へ</small></div>
 <div class="arw">▶</div>
 <div class="sp"><div class="n">3</div><span class="when">発送</span>
  <svg width="150" height="96" viewBox="0 0 150 96"><text x="75" y="18" text-anchor="middle" font-size="16" font-weight="900" fill="#4f7a95">❄ 冷凍便 ❄</text><path d="M22 28h106v62H22z" fill="#e3e7ea" stroke="#7a8a94" stroke-width="3.5"/><rect x="46" y="40" width="58" height="40" rx="3" fill="#fff" stroke="#b55a4f" stroke-width="3"/><path d="M54 50h42M54 59h42M54 68h26" stroke="#9aa8a1" stroke-width="2.5"/><rect x="84" y="64" width="14" height="10" fill="#b55a4f"/></svg>
  <b>同梱の発送表を貼り付けて、<br>冷凍便で発送</b><small>保冷袋に発送表を貼るだけ<br>（宛先・品名は記入済み）</small></div>
</div>
<div class="mail"><svg width="40" height="30" viewBox="0 0 40 30"><rect x="2" y="2" width="36" height="26" rx="3" fill="#fff" stroke="#3f6b45" stroke-width="3"/><path d="M2 4l18 13L38 4" fill="none" stroke="#3f6b45" stroke-width="3"/></svg><div><b>発送したら、センターにメールで一言</b><br>動画・聞き取りシートのアップロードは、後日まとめてでもOK</div></div>
</div></body></html>
