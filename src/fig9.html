<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.w{width:1000px}
.card{border:5px solid var(--zone);border-radius:22px;overflow:hidden;background:#fff}
.top{background:var(--zone);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 26px}
.top .zn{font-size:54px;font-weight:900;line-height:1.1}
.top .rt{text-align:right;font-size:21px;line-height:1.45}.top .rt b{font-size:24px}
.sz{padding:12px 26px;background:var(--zone-bg);border-bottom:3px solid var(--zone)}
.sz .h{font-size:23px;font-weight:900;color:#5c4900}.sz .h small{font-weight:400;font-size:18px;margin-left:8px}
.pen{display:flex;align-items:baseline;gap:8px;font-size:26px;font-weight:700;margin-top:8px}
.pen .ln{display:inline-block;width:92px;border-bottom:3px solid #1c2622;height:28px}
.pen .l{font-size:22px;font-weight:900;color:#5c4900;width:78px}
.pts{padding:14px 26px 6px}.pts .h{font-size:23px;font-weight:900;margin-bottom:8px}
.pt{display:grid;grid-template-columns:44px 64px 1fr;gap:12px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:8px 14px;margin-bottom:10px}
.pt .no{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;font-size:26px;font-weight:900;text-align:center;line-height:44px}
.pt b{font-size:27px;display:block;line-height:1.25}.pt small{display:block;font-size:19px;color:var(--muted);line-height:1.35}
.pt.big{border-color:var(--zone);background:#fffdf5}
.yo{display:inline-block;font-size:17px;font-weight:900;color:#fff;background:#c2362b;border-radius:999px;padding:0 12px;margin-right:6px;vertical-align:3px}
.ft{margin:6px 26px 16px;background:var(--a-bg);border:2px solid var(--a);border-radius:12px;padding:8px 14px;font-size:21px;font-weight:700;color:var(--a)}
.yrow{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.yo{display:inline-block;font-size:18px;font-weight:900;color:#fff;background:#c2362b;border-radius:999px;padding:0 12px}
.yi{display:inline-block;font-size:22px;font-weight:900;border:2.5px solid #c2362b;color:#c2362b;border-radius:10px;padding:0 12px;background:#fff}
.plus{border:2.5px dashed var(--zone);border-radius:14px;padding:8px 14px 10px;margin:4px 0 16px}
.ph{font-size:22px;font-weight:900;color:#5c4900;margin-bottom:6px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pp{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center}
.pp b{font-size:23px;display:block;line-height:1.25}
.cd{display:inline-block;margin-top:2px;font-size:16px;font-weight:900;color:#fff;background:#8a6d00;border-radius:999px;padding:0 10px}
.pb{font-size:23px!important;margin-top:2px}.pg{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:6px}</style></head><body><div class="w"><div class="card">
 <div class="top"><div class="zn">Z3　ハッチ</div><div class="rt"><b>Zoneカード（K式）</b><br>スマホは<b>横</b>・1Zone 1本<br><b>止めずに</b>続けて撮る</div></div>
 <div class="sz"><div class="h">牛房サイズ<small>代表1〜2か所を測って、マジックで書く</small></div>
  <div class="pen"><span class="l">牛房A</span>縦<span class="ln"></span>m　×　横<span class="ln"></span>m</div>
  <div class="pen"><span class="l">牛房B</span>縦<span class="ln"></span>m　×　横<span class="ln"></span>m</div></div>
 <div class="pts"><div class="h">撮るところ（番号の順に）</div>
  <div class="pt"><div class="no">1</div><svg width="58" height="56" viewBox="0 0 58 56"><rect x="8" y="10" width="40" height="36" rx="5" fill="#fbf3d2" stroke="#8a6d00" stroke-width="3"/><path d="M15 22h26M15 31h18" stroke="#8a6d00" stroke-width="3"/></svg><div><b>このカード</b><small>牛房サイズが読めるように</small></div></div>
  <div class="pt big"><div class="no">2</div><svg width="64" height="56" viewBox="0 0 64 56"><path d="M6 38q26-30 52 0" fill="none" stroke="#1c2622" stroke-width="3.5"/><path d="M6 38l-1-11M6 38l12-2M58 38l1-11M58 38l-12-2" stroke="#1c2622" stroke-width="3.5" stroke-linecap="round"/><circle cx="24" cy="46" r="4" fill="#8a6d00"/><circle cx="34" cy="48" r="4" fill="#8a6d00"/><circle cx="44" cy="46" r="4" fill="#8a6d00"/></svg><div><b>Zone全体</b><small>Zoneの中を移動しながら、すべての牛が映るように</small>
   <div class="yrow"><span class="yo">途中で寄る</span><span class="yi">消毒槽</span><span class="yi">水槽・水桶</span></div></div></div>
  <div class="pt" style="border-style:dashed;border-color:var(--zone)"><div class="no">3</div><svg width="58" height="56" viewBox="0 0 58 56"><path d="M18 22h16v26q0 4-4 4h-8q-4 0-4-4z" fill="#fff" stroke="#1c2622" stroke-width="3"/><path d="M20 22q6-14 12 0" fill="#e6c9a8" stroke="#1c2622" stroke-width="3"/></svg>
   <div><b>＋α　このZoneにあれば</b>
   <div class="pg">
    <div><span class="cd">哺乳牛Zone</span><b class="pb">哺乳具・流し場</b><small>別の建物なら、止めずに歩いて移動して撮る</small></div>
    <div><span class="cd">ロボットZone</span><b class="pb">哺乳ロボットのライン</b></div>
   </div></div></div></div>
 </div>
</div></div></body></html>
