<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:"Noto Sans CJK JP",sans-serif;color:#1f2328}
.w{width:1000px;background:#fff;padding:14px 0 18px}
.sec{margin:0 26px;border:2px solid #f3c7a8;border-radius:12px;overflow:hidden}
.sh{background:#e0561b;color:#fff;font-weight:900;font-size:25px;text-align:center;padding:6px}
.steps{display:grid;grid-template-columns:1fr 34px 1fr 34px 1fr 34px 1fr;align-items:stretch;padding:16px 12px 12px}
.st{border:2px solid #f3c7a8;border-radius:12px;padding:10px 8px 12px;text-align:center;background:#fffaf6;display:flex;flex-direction:column;align-items:center}
.n{width:40px;height:40px;border-radius:50%;background:#e0561b;color:#fff;font-weight:900;font-size:24px;line-height:40px}
.t{font-size:21px;font-weight:900;margin:6px 0 4px;line-height:1.25}
.s{font-size:15px;font-weight:700;color:#5d6a64;line-height:1.35}
.ar{display:flex;align-items:center;justify-content:center}
.ic{height:92px;display:flex;align-items:center;justify-content:center;margin:4px 0}
.opt{width:100%;font-size:14px;font-weight:700;background:#fff;border:1px solid #e9cbb6;border-radius:6px;padding:3px 4px;margin-top:4px}
.ch{display:flex;gap:6px;justify-content:center;margin-top:4px}
.ch span{border-radius:999px;color:#fff;font-weight:900;font-size:15px;padding:2px 10px}
.bot{margin:0 12px 14px;background:#fff3ea;border-radius:10px;padding:8px;text-align:center;font-size:18px;font-weight:900;color:#c8361c}
.ch{flex-direction:column;align-items:center}
.ch span{font-size:13px!important;line-height:1.35;padding:2px 10px!important;text-align:center}
</style></head><body><div class="w"><div class="sec"><div class="sh">申請のしかた（共通）</div>
